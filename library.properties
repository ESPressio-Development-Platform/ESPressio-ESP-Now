includes=ESPressio_ESPNow.hpp
depends=ESPressio-Task,ESPressio-Timing (>=2.2.8 && <3.0.0),ESPressio-Observable (>=3.0.2 && <4.0.0),ESPressio-Threads (>=3.1.7 && <4.0.0),ESPressio-Event,ESPressio-Command

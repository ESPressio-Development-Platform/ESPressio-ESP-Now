sentence=ESP-NOW transport and distributed ESPressio integrations for ESP32
paragraph=Provides reusable ESP-NOW transport infrastructure, a rate-limited ESPressio PrecisionThread worker, bounded ESPressio Task handoff for application protocols, observable transport/peer lifecycle notifications, peer-liveness tracking, distributed System Clock synchronization, optional asynchronous Event/Command transports and authenticated encryption via ESPressio Security.

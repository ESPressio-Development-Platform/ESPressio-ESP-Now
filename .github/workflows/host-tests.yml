name: Tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: main
          path: deps/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Command
          ref: main
          path: deps/ESPressio-Command
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: main
          path: deps/ESPressio-Observable
      - name: Configure
        run: >-
          cmake -S tests -B build
          -DESPRESSIO_SYSTEM_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-System/src"
          -DESPRESSIO_COMMAND_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Command/src"
          -DESPRESSIO_OBSERVABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Observable/src"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  dependency-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify integration boundaries and worker architecture
        shell: bash
        run: |
          if grep -E 'ESPressio_(Event|Command|Security)' src/ESPressio_ESPNow.hpp; then
            echo 'Core ESP-Now umbrella must not acquire optional integration dependencies.' >&2
            exit 1
          fi
          test -f src/ESPressio_ESPNowEventTransport.hpp
          test -f src/ESPressio_ESPNowEvents.hpp
          test -f src/ESPressio_ESPNowTransportEventBridge.hpp
          test -f src/ESPressio_ESPNowAsyncProtocolHandler.hpp
          grep -q 'PrecisionThread' src/ESPressio_ESPNowTransport.hpp
          grep -q 'WorkerIterationIntervalMilliseconds' src/ESPressio_ESPNowTypes.hpp
          grep -q 'ESPNowAsyncProtocolHandler' src/ESPressio_ESPNowCommandTransport.hpp
          grep -q 'ESPNowAsyncProtocolHandler' src/ESPressio_ESPNowEventTransport.hpp
          grep -q 'InboundCommandEvent' src/ESPressio_ESPNowCommandTransport.hpp
          if grep -q 'xTaskCreatePinnedToCore' src/ESPressio_ESPNowTransport.hpp; then
            echo 'ESP-Now transport must not regress to a raw receive task.' >&2
            exit 1
          fi

  esp32-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-ESPNow
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: main
          path: project/dependencies/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: main
          path: project/dependencies/ESPressio-Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Event
          ref: main
          path: project/dependencies/ESPressio-Event
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Command
          ref: main
          path: project/dependencies/ESPressio-Command
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Security
          ref: main
          path: project/dependencies/ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: main
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: main
          path: project/dependencies/ESPressio-Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: main
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: main
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: main
          path: project/dependencies/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-WiFi
          ref: main
          path: project/dependencies/ESPressio-WiFi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create integration compile project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -fno-rtti
              -DESPRESSIO_SERIALIZATION_PREFER_PSRAM
          build_unflags =
              -std=gnu++11
              -frtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Task
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Event
              ../dependencies/ESPressio-Command
              ../dependencies/ESPressio-Security
              ../dependencies/ESPressio-WiFi
              ../ESPressio-ESPNow
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_ThreadManager.hpp>
          #include <ESPressio_WiFi.hpp>
          #include <ESPressio_ESPNow.hpp>
          #include <ESPressio_ESPNowEventTransport.hpp>
          #include <ESPressio_ESPNowEvents.hpp>
          #include <ESPressio_ESPNowTransportEventBridge.hpp>
          #include <ESPressio_ESPNowCommandTransport.hpp>
          #include <ESPressio_ESPNowSecureTransport.hpp>
          #include <ESPressio_CommandEventExecutor.hpp>

          ESPressio::ESPNow::ESPNowCommandTransport commandTransport;

          void setup() {
              ESPressio::Threads::ThreadManager::GetInstance()->Initialize();
              auto& transport = ESPressio::ESPNow::ESPNowTransport::GetInstance();
              ESPressio::ESPNow::ESPNowTransportConfig config;
              config.InitializeWiFi = false;
              config.Channel = 0;
              config.WorkerIterationIntervalMilliseconds = 10;
              transport.Initialize(config);

              auto& commandExecutor = ESPressio::Command::CommandEventExecutor::GetInstance();
              commandExecutor.Prepare();

              commandTransport.Initialize(transport);

              ESPressio::Command::CommandInvocation invocation;
              invocation.path = {"gpio", "write"};
              invocation.named["pin"] = 2;
              invocation.named["state"] = true;

              (void)commandTransport.GetAsyncHandlerStatistics();
              (void)commandTransport.GetRejectedAsyncHandoffCount();
          }

          void loop() {
              // #47 regression: neither receive processing nor Command
              // application execution is driven from Arduino loop().
          }
          EOF
      - name: Compile ESP32 integrations including bounded async protocol handoff
        run: pio run -d project/compile

name: Security Integration

on:
  push:
  pull_request:

jobs:
  host-security-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: main, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Command, ref: main, path: deps/ESPressio-Command}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: main, path: deps/ESPressio-Observable}
      - name: Configure
        run: >-
          cmake -S tests -B build
          -DESPRESSIO_SYSTEM_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-System/src"
          -DESPRESSIO_COMMAND_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Command/src"
          -DESPRESSIO_OBSERVABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Observable/src"
      - name: Build security protocol test
        run: cmake --build build --target test_security_protocol --parallel
      - name: Test security protocol
        run: ctest --test-dir build -R ESPNowSecurityProtocol --output-on-failure

  esp32-secure-peer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Security, ref: main, path: deps/ESPressio-Security}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: main, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-ESP32, ref: main, path: deps/ESPressio-ESP32}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: main, path: deps/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: main, path: deps/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: main, path: deps/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: main, path: deps/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: main, path: deps/ESPressio-Threads}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create PlatformIO consumer project
        shell: bash
        run: |
          PROJECT="$RUNNER_TEMP/espressio-espnow-security-ci"
          mkdir -p "$PROJECT/src" "$PROJECT/lib"
          rsync -a --exclude='.git' --exclude='deps' --exclude='build' ./ "$PROJECT/lib/ESPressio-ESPNow/"
          for DEP in ESPressio-Security ESPressio-System ESPressio-ESP32 ESPressio-Task ESPressio-Timing ESPressio-Units ESPressio-Observable ESPressio-Threads; do
            cp -R "deps/$DEP" "$PROJECT/lib/$DEP"
          done
          cat > "$PROJECT/platformio.ini" <<'EOF'
          [env:esp32dev]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -fno-rtti
              -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/libraries/Network/src
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          EOF
          {
            echo '#include <Network.h>'
            cat examples/SecurePeer/SecurePeer.ino
          } > "$PROJECT/src/main.cpp"
      - name: Compile SecurePeer against coordinated Item-4 saturation branches without RTTI
        run: pio run -d "$RUNNER_TEMP/espressio-espnow-security-ci"

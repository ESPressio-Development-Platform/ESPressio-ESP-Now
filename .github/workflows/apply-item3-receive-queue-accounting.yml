name: Apply Item 3 Receive Queue Accounting

on:
  push:
    branches:
      - bugfix/39-wifi-coexistence
    paths:
      - tools/apply_item3_receive_queue_accounting.py
      - .github/workflows/apply-item3-receive-queue-accounting.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/39-wifi-coexistence
          fetch-depth: 0
      - name: Apply guarded Item 3 patch
        run: python3 tools/apply_item3_receive_queue_accounting.py
      - name: Commit production and regression changes
        shell: bash
        run: |
          if git diff --quiet -- src/ESPressio_ESPNowTransport.hpp .github/workflows/wifi-coexistence-tests.yml; then
            echo 'No guarded Item 3 changes were required.'
            exit 0
          fi
          git config user.name 'Simon J Stuart'
          git config user.email 'lakraven@gmail.com'
          git add src/ESPressio_ESPNowTransport.hpp .github/workflows/wifi-coexistence-tests.yml
          git commit -m 'fix: account for rejected ESP-NOW receive frames'
          git push origin HEAD:bugfix/39-wifi-coexistence

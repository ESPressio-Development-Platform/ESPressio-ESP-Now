name: WiFi Coexistence Tests

on:
  push:
  pull_request:

jobs:
  esp32-coexistence-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-ESP-Now
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: project/dependencies/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-ESP32
          ref: feature/1-system-memory-provider
          path: project/dependencies/ESPressio-ESP32
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-WiFi
          ref: feature/20-wifi-off-mode
          path: project/dependencies/ESPressio-WiFi
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: feature/29-platform-clock-abstractions
          path: project/dependencies/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: feature/16-rtti-free-observer-registry
          path: project/dependencies/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: main
          path: project/dependencies/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: optimisation/69-resource-footprint
          path: project/dependencies/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: optimisation/25-psram-buffers
          path: project/dependencies/ESPressio-Serializable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create coordinated AP+STA coexistence consumer
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -fno-rtti
              -DESPRESSIO_SERIALIZATION_PREFER_PSRAM
              -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/libraries/Network/src
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          lib_deps =
              ../dependencies/ESPressio-System
              ../dependencies/ESPressio-ESP32
              ../dependencies/ESPressio-Observable
              ../dependencies/ESPressio-Units
              ../dependencies/ESPressio-Timing
              ../dependencies/ESPressio-Threads
              ../dependencies/ESPressio-Serializable
              ../dependencies/ESPressio-WiFi
              ../ESPressio-ESP-Now
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <Network.h>
          #include <type_traits>
          #include <ESPressio_ESP32.hpp>
          #include <ESPressio_ThreadManager.hpp>
          #include <ESPressio_WiFiPlatform.hpp>
          #include <ESPressio_WiFiWorker.hpp>
          #include <ESPressio_ESPNow.hpp>
          #include <ESPressio_ESPNowWiFiCoordinator.hpp>

          static_assert(std::is_base_of<
              ESPressio::WiFi::IWiFiRadioObserver,
              ESPressio::ESPNow::ESPNowWiFiCoordinator
          >::value, "Coordinator must observe radio lifecycle");

          class Observer final : public ESPressio::ESPNow::IESPNowTransportObserver {
          public:
              void OnESPNowSendFailedDetailed(
                  const ESPressio::ESPNow::MacAddress&,
                  uint8_t,
                  std::size_t,
                  ESPressio::ESPNow::ESPNowSendFailure,
                  int32_t
              ) override {}
          } observer;

          ESPressio::WiFi::WiFiPlatform wifiPlatform;
          ESPressio::WiFi::WiFiManager wifiManager(wifiPlatform);
          ESPressio::WiFi::WiFiWorker wifiWorker(wifiManager);
          auto& transport = ESPressio::ESPNow::ESPNowTransport::GetInstance();
          ESPressio::ESPNow::ESPNowWiFiCoordinator coordinator(transport, wifiManager);

          void setup() {
              ESPressio::ESP32Platform::InstallSystemProviders();

              ESPressio::WiFi::WiFiConfiguration wifiConfig;
              wifiConfig.Mode = ESPressio::WiFi::WiFiMode::APUntilClient;
              wifiConfig.Client.Enabled = true;
              wifiConfig.AccessPoint.Enabled = true;
              wifiConfig.AccessPoint.SSID = "espnow-coexistence-test";
              wifiConfig.AccessPoint.Channel = 1;
              wifiManager.Configure(std::move(wifiConfig));

              ESPressio::Threads::ThreadManager::GetInstance()->Initialize();
              wifiWorker.Start();

              ESPressio::ESPNow::ESPNowTransportConfig transportConfig;
              transportConfig.InitializeWiFi = false;
              transportConfig.Channel = 0;
              transportConfig.WorkerIterationIntervalMilliseconds = 10;
              transport.RegisterObserver(&observer);
              transport.Initialize(transportConfig);
              coordinator.Initialize();

              ESPressio::WiFi::WiFiRadioState apsta;
              apsta.Mode = ESPressio::WiFi::WiFiRadioMode::AccessPointStation;
              apsta.StationInterfaceActive = true;
              apsta.AccessPointInterfaceActive = true;
              (void)ESPressio::ESPNow::ESPNowWiFiCoordinator::ResolvePreferredInterface(apsta);

              ESPressio::ESPNow::ESPNowPeerConfig peer;
              const uint8_t address[6] = {0x02,0,0,0,0,1};
              peer.Address = ESPressio::ESPNow::MacAddress(address);
              peer.Channel = 0;
              peer.Interface = ESPressio::ESPNow::ESPNowWiFiInterface::Auto;
              (void)transport.AddPeer(peer);
              (void)transport.ReconcileManagedPeers();
              (void)transport.GetLocalEndpointAddress();
              (void)transport.SendDetailed(peer.Address, 64, nullptr, 0);
              (void)transport.GetLastSendResult();
              (void)transport.GetReceiveQueueRejectedCount();
          }
          void loop() { delay(1000); }
          EOF
      - name: Compile coexistence surface without RTTI
        run: pio run -d project/compile

  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard version, coexistence and worker contract
        shell: bash
        run: |
          grep -q 'Current Version — 0.8.3' README.md
          grep -q 'ESPNowWiFiInterface' src/ESPressio_ESPNowTypes.hpp
          grep -q 'ESPNowRadioBinding' src/ESPressio_ESPNowTypes.hpp
          grep -q 'RadioUnavailable' src/ESPressio_ESPNowTypes.hpp
          grep -q 'SendDetailed' src/ESPressio_ESPNowTransport.hpp
          grep -q 'ReconcileManagedPeers' src/ESPressio_ESPNowTransport.hpp
          grep -q 'ReinitializeNativeState' src/ESPressio_ESPNowTransport.hpp
          grep -q 'ESPNowWiFiCoordinator' src/ESPressio_ESPNowWiFiCoordinator.hpp
          grep -q 'StationInterfaceActive' src/ESPressio_ESPNowWiFiCoordinator.hpp
          grep -q 'AccessPointStation' src/ESPressio_ESPNowWiFiCoordinator.hpp
          if grep -q 'OnAccessPointStationConnected' src/ESPressio_ESPNowWiFiCoordinator.hpp; then
            echo 'Coordinator must not rebuild ESP-NOW synchronously from AP station association callbacks.' >&2
            exit 1
          fi
          grep -q 'WorkerIterationIntervalMilliseconds' src/ESPressio_ESPNowTypes.hpp
          grep -q 'PrecisionThread' src/ESPressio_ESPNowTransport.hpp
          grep -q 'GetReceiveQueueRejectedCount' src/ESPressio_ESPNowTransport.hpp
          grep -q '_receiveQueueRejectedCount.fetch_add(1, std::memory_order_relaxed)' src/ESPressio_ESPNowTransport.hpp
          if grep -q '(void)self->_receiveQueue->Send(&frame, 0)' src/ESPressio_ESPNowTransport.hpp; then
            echo 'Native ESP-NOW receive callback must account for rejected bounded-queue submissions.' >&2
            exit 1
          fi
          if grep -q 'xTaskCreatePinnedToCore' src/ESPressio_ESPNowTransport.hpp; then
            echo 'Raw ESP-NOW receive task regressed into transport.' >&2
            exit 1
          fi

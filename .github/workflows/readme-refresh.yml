name: Refresh dependency README

on:
  push:
    branches:
      - feature/10-timing-2.2.3-dependency-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/10-timing-2.2.3-dependency-refresh
      - name: Refresh current-version documentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          start = text.index('## Latest Stable Version')
          end = text.index('## Compatibility', start)
          current = """## Current Version — 0.5.1

ESPressio ESP-Now 0.5.1 is a dependency-maintenance patch over 0.5.0. It retains the Observable transport/peer lifecycle API while raising the required Timing baseline to 2.2.3.

```text
Required
    ESPressio Timing >= 2.2.3 < 3.0.0
    ESPressio Observable >= 3.0.1 < 4.0.0

Optional Event Transport
    ESPressio Event >= 5.8.0 < 6.0.0

Optional Command Transport
    ESPressio Command >= 0.3.0 < 1.0.0

Optional Secure Transport
    ESPressio Security >= 0.2.0 < 1.0.0
```

The Event relationship intentionally remains a compatible 5.x opt-in range rather than being tightened to Event 5.8.1: Event currently also hosts an ESP-Now-specific Observer bridge. The preferred future architecture moves `ESPNowTransportEventBridge` downstream into ESP-Now's optional Event integration (or a dedicated integration package).

"""
          text = text[:start] + current + text[end:]
          replacements = [
              ('ESPressio ESP-Now `0.4.0` targets the ESP32 family under Arduino-ESP32 and requires C++17.', 'ESPressio ESP-Now `0.5.1` targets the ESP32 family under Arduino-ESP32 and requires C++17.'),
              ('### Required for stable 0.4.0', '### Required for 0.5.1'),
              ('ESPressio Timing >= 2.2.2 < 3.0.0\nArduino-ESP32', 'ESPressio Timing >= 2.2.3 < 3.0.0\nESPressio Observable >= 3.0.1 < 4.0.0\nArduino-ESP32'),
              ('### Optional for stable 0.4.0', '### Optional for 0.5.1'),
              ('ESPressio Event >= 5.7.1 < 6.0.0', 'ESPressio Event >= 5.8.0 < 6.0.0'),
              ('ESPressio Command >= 0.2.0 < 1.0.0', 'ESPressio Command >= 0.3.0 < 1.0.0'),
              ('ESPressio Security >= 0.1.0 < 1.0.0', 'ESPressio Security >= 0.2.0 < 1.0.0'),
              ('https://github.com/Flowduino/ESPressio-ESP-Now@^0.4.0', 'https://github.com/Flowduino/ESPressio-ESP-Now@^0.5.1'),
              ('https://github.com/Flowduino/ESPressio-Timing@^2.2.2', 'https://github.com/Flowduino/ESPressio-Timing@^2.2.3'),
              ('The 0.5.0 development branch additionally exposes `IESPNowTransportObserver` through the core transport.', '`IESPNowTransportObserver` is part of the current 0.5.x core transport API.'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected README text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: refresh ESP-Now 0.5.1 README (#10)'
          git push origin HEAD:feature/10-timing-2.2.3-dependency-refresh

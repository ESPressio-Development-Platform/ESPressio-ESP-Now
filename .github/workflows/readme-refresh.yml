name: Refresh dependency README

on:
  push:
    branches:
      - feature/10-timing-2.2.3-dependency-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/10-timing-2.2.3-dependency-refresh
      - name: Refresh current-version documentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          start = text.index('## Latest Stable Version')
          end = text.index('## Compatibility', start)
          current = '''## Current Version — 0.5.1

ESPressio ESP-Now 0.5.1 is a dependency-maintenance patch over 0.5.0. It retains the Observable transport/peer lifecycle API while raising the required Timing baseline to 2.2.3.

Current dependency model:

```text
Required
    ESPressio Timing >= 2.2.3 < 3.0.0
    ESPressio Observable >= 3.0.1 < 4.0.0

Optional Event Transport
    ESPressio Event >= 5.8.0 < 6.0.0

Optional Command Transport
    ESPressio Command >= 0.3.0 < 1.0.0

Optional Secure Transport
    ESPressio Security >= 0.2.0 < 1.0.0
```

The Event relationship intentionally remains a compatible 5.x opt-in range rather than being tightened to Event 5.8.1: Event currently also hosts an ESP-Now-specific Observer bridge, so strengthening both directions would reinforce a circular optional dependency. The preferred future architecture moves `ESPNowTransportEventBridge` downstream into ESP-Now's optional Event integration (or a dedicated integration package).

'''
          text = text[:start] + current + text[end:]

          comp_start = text.index('## Compatibility')
          comp_end = text.index('## Header Structure', comp_start)
          compatibility = '''## Compatibility

ESPressio ESP-Now `0.5.1` targets the ESP32 family under Arduino-ESP32 and requires C++17.

The common ESP-NOW transport uses Espressif ESP-NOW/Wi-Fi APIs plus FreeRTOS queues/tasks. Core 0.5.1 requires Timing 2.2.3 and Observable 3.0.1 within their current major lines. Event, Command, and Security integrations remain opt-in.

## ESPressio Development Platform

ESPressio libraries are discrete, composable components built around a common design ethos: light-weight, developer-friendly, object-oriented, SOLID, and pay-only-for-selected functionality.

ESPressio ESP-Now owns ESP-NOW-specific peer/radio/framing concerns. Timing owns clock discipline, Event owns Event semantics, Command owns Command semantics, and Security owns cryptography/authentication/replay protection.

## License

ESPressio and its component libraries are licensed under the **Apache License 2.0**. See [LICENSE](LICENSE).

## ESPressio Library Dependencies

### Required

```text
ESPressio Timing >= 2.2.3 < 3.0.0
ESPressio Observable >= 3.0.1 < 4.0.0
Arduino-ESP32
```

Timing 2.2.3 carries Units 0.2.2 downstream. Serializable remains optional through selected Serializable Unit/Event facilities and is not a core ESP-Now dependency.

### Optional

```text
Event Transport
    ESPressio Event >= 5.8.0 < 6.0.0

Command Transport
    ESPressio Command >= 0.3.0 < 1.0.0

Secure Transport
    ESPressio Security >= 0.2.0 < 1.0.0
```

## Namespace

```cpp
ESPressio::ESPNow
```

## PlatformIO

Core ESP-NOW/Timing usage:

```ini
lib_deps =
    https://github.com/Flowduino/ESPressio-ESP-Now@^0.5.1
    https://github.com/Flowduino/ESPressio-Timing@^2.2.3
    https://github.com/Flowduino/ESPressio-Observable@^3.0.1

build_flags =
    -std=gnu++17

build_unflags =
    -std=gnu++11
    -fno-rtti
```

Add Event, Command, or Security dependencies only when their corresponding adapters are selected.

'''
          text = text[:comp_start] + compatibility + text[comp_end:]
          path.write_text(text)
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: refresh ESP-Now 0.5.1 README (#10)'
          git push origin HEAD:feature/10-timing-2.2.3-dependency-refresh

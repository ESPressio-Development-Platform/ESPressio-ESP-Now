name: Validate ESP32 Command Example

on:
  push:
    branches: [feature/command-transport]
    paths: ['.github/workflows/validate-esp32-command-example.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-transport
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Command
          ref: 0.2.0
          path: deps/ESPressio-Command
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Timing
          ref: 2.2.2
          path: deps/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Units
          ref: 0.2.1
          path: deps/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Observable
          ref: 3.0.1
          path: deps/ESPressio-Observable
      - name: Compile and report
        shell: bash
        run: |
          set +e
          pip install platformio > install.log 2>&1
          i=$?
          if [ $i -eq 0 ]; then
            pio ci examples/CommandPeer/CommandPeer.ino --board esp32dev --lib . --lib deps/ESPressio-Command --lib deps/ESPressio-Timing --lib deps/ESPressio-Units --lib deps/ESPressio-Observable > compile.log 2>&1
            c=$?
          else
            c=99
            : > compile.log
          fi
          {
            echo "install_exit=$i"
            echo "compile_exit=$c"
            cat compile.log
          } > validation.txt
          cat validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .ci
          mv validation.txt .ci/esp32-command-example-validation.txt
          git add -- .ci/esp32-command-example-validation.txt
          git commit -m "chore: record ESP32 Command example validation" || true
          git push origin HEAD:feature/command-transport

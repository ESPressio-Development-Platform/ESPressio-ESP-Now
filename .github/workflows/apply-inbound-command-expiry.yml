name: Apply inbound Command expiry

on:
  push:
    branches:
      - bugfix/39-wifi-coexistence
    paths:
      - tools/apply_inbound_command_expiry_fix.py
      - .github/workflows/apply-inbound-command-expiry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/39-wifi-coexistence
          fetch-depth: 0
      - name: Apply guarded transformation
        run: python tools/apply_inbound_command_expiry_fix.py
      - name: Validate patch
        run: git diff --check
      - name: Commit production source, regression coverage, and docs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ESPressio_ESPNowCommandEndpoint.hpp tests/test_async_command_handoff.cpp COMMAND_INTEGRATION.md
          git commit -m 'fix: expire abandoned inbound Command requests'
          git push origin HEAD:bugfix/39-wifi-coexistence

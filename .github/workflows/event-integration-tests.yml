name: Event Integration

on:
  push:
  pull_request:

jobs:
  event-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core umbrella remains Event-free
        shell: bash
        run: |
          if grep -E '^#include[[:space:]]*[<\"]ESPressio_(Event|SerializableEvent|ESPNowEvents|ESPNowTransportEventBridge)' src/ESPressio_ESPNow.hpp; then exit 1; fi

  esp32-event-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: structural_realignment, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: structural_realignment, path: deps/ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Event, ref: structural_realignment, path: deps/ESPressio-Event}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: structural_realignment, path: deps/ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: structural_realignment, path: deps/ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: structural_realignment, path: deps/ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: structural_realignment, path: deps/ESPressio-Observable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: structural_realignment, path: deps/ESPressio-Serializable}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create PlatformIO consumer project
        shell: bash
        run: |
          PROJECT="$RUNNER_TEMP/espressio-espnow-event-ci"
          mkdir -p "$PROJECT/src" "$PROJECT/lib/ESPressio-ESPNow"
          cp -R src "$PROJECT/lib/ESPressio-ESPNow/src"
          for DEP in ESPressio-System ESPressio-Task ESPressio-Event ESPressio-Threads ESPressio-Timing ESPressio-Units ESPressio-Observable ESPressio-Serializable; do
            mkdir -p "$PROJECT/lib/$DEP"
            cp -R "deps/$DEP/src" "$PROJECT/lib/$DEP/src"
          done
          cat > "$PROJECT/platformio.ini" <<'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags =
              -std=gnu++17
              -fno-rtti
              -DESPRESSIO_SERIALIZATION_PREFER_PSRAM
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          EOF
          cat > "$PROJECT/src/main.cpp" <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_ESPNow.hpp>
          #include <ESPressio_ESPNowEventTransport.hpp>
          #include <ESPressio_ESPNowEvents.hpp>
          #include <ESPressio_ESPNowTransportEventBridge.hpp>
          #include <ESPressio_EventTransport.hpp>
          using namespace ESPressio;
          ESPNow::ESPNowEventTransport eventTransport;
          void setup() {
              auto& espNow = ESPNow::ESPNowTransport::GetInstance();
              auto& eventTransports = Event::EventTransportManager::GetInstance();
              eventTransport.Initialize(espNow);
              eventTransports.RegisterTransport(&eventTransport);
          }
          void loop() { delay(10); }
          EOF
      - name: Compile Event integration against current RTTI-free branches
        run: pio run -d "$RUNNER_TEMP/espressio-espnow-event-ci"

name: Dependency README maintenance

on:
  push:
    branches:
      - feature/12-timing-2.2.4-dependency-refresh

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean current dependency wording
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = 'Timing 2.2.4 carries Units 0.2.3 downstream, with Serializable 0.10.2 remaining opt-in through Serializable Unit/Event facilities. Serializable remains optional through selected Serializable Unit/Event facilities and is not a core ESP-Now dependency.'
          new = 'Timing 2.2.4 carries Units 0.2.3 downstream. Serializable 0.10.2 remains optional through selected Serializable Unit/Event facilities and is not a core ESP-Now dependency.'
          if old not in text:
              raise SystemExit('Missing expected duplicated dependency wording')
          path.write_text(text.replace(old, new, 1))
      - name: Commit README cleanup
        shell: bash
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'docs: clean ESP-Now 0.5.2 dependency wording (#12)'
          git push

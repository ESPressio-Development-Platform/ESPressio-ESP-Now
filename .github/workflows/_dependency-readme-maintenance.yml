name: Dependency README maintenance

on:
  push:
    branches:
      - feature/12-timing-2.2.4-dependency-refresh

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update current dependency references
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          required = ['0.5.1', '2.2.3', '0.2.2', '0.10.1', 'Event 5.8.1']
          for value in required:
              if value not in text:
                  raise SystemExit(f'Missing expected README text: {value}')
          text = text.replace('0.5.1', '0.5.2')
          text = text.replace('2.2.3', '2.2.4')
          text = text.replace('0.2.2', '0.2.3')
          text = text.replace('0.10.1', '0.10.2')
          text = text.replace('Event 5.8.1', 'Event 5.8.2')
          path.write_text(text)
      - name: Commit README update
        shell: bash
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'docs: refresh ESP-Now 0.5.2 dependency references (#12)'
          git push

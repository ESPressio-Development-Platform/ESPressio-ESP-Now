name: Patch Command Documentation

on:
  push:
    branches: [feature/command-transport]
    paths: ['.github/workflows/patch-command-docs.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-transport
      - name: Patch documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('The library provides distributed **ESPressio System Clock synchronization** and, from 0.2.0, an optional concrete **ESPressio Event Transport** adapter for routing Serializable Events over ESP-NOW.', 'The library provides distributed **ESPressio System Clock synchronization**, an optional concrete **ESPressio Event Transport** adapter for routing Serializable Events over ESP-NOW, and from 0.3.0 an optional **ESPressio Command Transport** for correlated remote Command invocation/result exchange.')
          text = text.replace('The latest Stable Version is **0.2.3**.', 'The latest Stable Version is **0.3.0**.')
          text = text.replace('ESPressio ESP-Now `0.2.3` targets', 'ESPressio ESP-Now `0.3.0` targets')
          text = text.replace('Core ESPressio ESP-Now `0.2.3` requires:', 'Core ESPressio ESP-Now `0.3.0` requires:')
          marker = 'The Event Transport adapter is deliberately opt-in. Projects that include `ESPressio_ESPNowEventTransport.hpp` must also provide **ESPressio Event >= 5.7.1 < 6.0.0** (and therefore its opt-in Serializable dependency). Projects that use only ESP-NOW transport/clock synchronization do not require ESPressio Event or ESPressio Serializable.'
          addition = marker + '\n\nThe Command Transport adapter is likewise opt-in. Projects that include `ESPressio_ESPNowCommandTransport.hpp` must provide **ESPressio Command >= 0.2.0 < 1.0.0**. Command transport uses its own compact binary structured protocol and does **not** require ESPressio Serializable or ArduinoJson. See [COMMAND_INTEGRATION.md](COMMAND_INTEGRATION.md).'
          text = text.replace(marker, addition)
          header_marker = '#include <ESPressio_ESPNowClockSynchronizer.hpp>\n```'
          text = text.replace(header_marker, '#include <ESPressio_ESPNowClockSynchronizer.hpp>\n```\n\nOptional Command transport:\n\n```cpp\n#include <ESPressio_ESPNowCommandTransport.hpp>\n```\n\nSee [Command integration](COMMAND_INTEGRATION.md) for remote invocation, fragmentation, correlation, duplicate suppression, policy, timeout and resource-limit details.')
          text = text.replace('flowduino/ESPressio-ESPNow@^0.2.3', 'https://github.com/flowduino/ESPressio-ESP-Now@^0.3.0')
          readme.write_text(text)

          chart = Path('ESPRESSIO_DEPENDENCY_CHART.md')
          c = chart.read_text()
          section = '''\n\n## ESPressio ESP-Now → ESPressio Command — opt-in\n\nESPressio ESP-Now 0.3.0 optionally consumes **ESPressio Command >= 0.2.0 < 1.0.0** when `ESPNowCommandEndpoint` or `ESPNowCommandTransport` is selected. Core ESP-NOW transport, Timing synchronization and Event Transport behavior do not acquire a Command dependency. The integration owns ESP-NOW framing, bounded fragmentation/reassembly, peer/request metadata, correlation, timeout handling and duplicate-request suppression; ESPressio Command continues to own Command definition, typed validation, routing and callback execution. The structured Command protocol does not require ESPressio Serializable.\n'''
          if '## ESPressio ESP-Now → ESPressio Command — opt-in' not in c:
              c += section
          chart.write_text(c)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md ESPRESSIO_DEPENDENCY_CHART.md
          git commit -m "docs: document ESP-NOW Command transport"
          git push origin HEAD:feature/command-transport
